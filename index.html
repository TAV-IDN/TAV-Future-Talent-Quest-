 else if(it.r==="ord"&&it.k==="build"){G.st.slots=[];

function pickOpt(i){if(G.answered)return;G.answered=true;var it=GAMES[G.gi].items[G.ii];
 var els=document.querySelectorAll(".choice");for(var k=0;k<els.length;k++)els[k].classList.remove("sel");
 var el=$("#ch"+i);if(el)el.classList.add("sel");
 record(i,pick(it.o[i][2]),null)}
function drawBuild(){var it=GAMES[G.gi].items[G.ii];
 $("#fill").innerHTML=G.st.slots.map(function(p){return '<div class="slot ok">'+p+'</div>'}).join("")+
 it.pat.slice(G.st.slots.length).map(function(){return '<div class="slot"></div>'}).join("")}
function ordPut(p){if(G.answered)return;var it=GAMES[G.gi].items[G.ii];
 if(G.st.slots.length>=it.pat.length)return;G.st.slots.push(p);drawBuild();
 if(G.st.slots.length===it.pat.length)setTimeout(checkOrd,350)}
function ordReset(){if(G.answered)return;G.st.slots=[];G.at++;drawBuild()}
function checkOrd(){if(G.answered)return;G.answered=true;var it=GAMES[G.gi].items[G.ii];
 var ok=it.pat.every(function(p,i){return G.st.slots[i]===p});if(!ok)G.at++;
 record(null,pick(ok?it.wf:it.wp),ok?"F":"P")}
function seqPut(i){if(G.answered)return;var it=GAMES[G.gi].items[G.ii];
 if(G.st.order.length>=it.steps.length)return;G.st.order.push(G.st.pool[i]);
 $("#fill").innerHTML=G.st.order.map(function(s){return '<div class="slot ok" style="width:auto;padding:4px 10px;font-size:13px;font-weight:800">'+s[0]+' '+esc(T(s[1]))+'</div>'}).join("");
 if(G.st.order.length===it.steps.length)setTimeout(finishSeq,350)}
function finishSeq(){if(G.answered)return;G.answered=true;var it=GAMES[G.gi].items[G.ii];
